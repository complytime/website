# Betterleaks configuration
# https://github.com/betterleaks/betterleaks
#
# Prefilter skips paths before regex matching:
# - node_modules/: vendored dependencies, not project secrets
# - .content-lock.json: maps repo names to commit SHAs; the "complyapi"
#   key triggers generic-api-key (key contains "api" + 40-char hex value)
prefilter = '''
matchesAny(get(attributes, "path", ""), [`node_modules/`, `.content-lock.json`])
'''

[extend]
useDefault = true

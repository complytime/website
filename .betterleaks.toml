# Betterleaks configuration
# https://github.com/betterleaks/betterleaks
#
# .content-lock.json maps repository names to commit SHAs.
# The "complyapi" key triggers generic-api-key because the key
# contains "api" and the value is a 40-char hex string.
# These are git commit hashes, not secrets.
prefilter = '''
matchesAny(get(attributes, "path", ""), [`.content-lock.json`])
'''

[extend]
useDefault = true
